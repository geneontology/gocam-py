---
site_name: "gocam"
theme:
  name: material
  # palette:
  #  scheme: slate
  #  primary: cyan
  features:
    - content.tabs.link
plugins:
  - search
  - mermaid2
  - mermaid2:
      version: 10.9.0
markdown_extensions:
  - attr_list
  - md_in_html
nav:
  - Schema reference: index.md
  - Getting started: getting-started.md
  - Advanced translation: advanced-translation.md
site_url: https://geneontology.github.io/gocam-py
repo_url: https://github.com/geneontology/gocam-py

