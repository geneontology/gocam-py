---
excludes:
  # Excluded for historical reason
  - excel
  - graphql
  # Documentation generation is handled separately
  - markdown
  # Pydantic is the preferred Python output format and is generated separately to
  # src/gocam/datamodel. Disable the old dataclass generator to avoid confusion and
  # duplication.
  - python
generator_args:
  owl:
    mergeimports: true
    metaclasses: true
    type_objects: true
    # throws 'Cannot handle metadata profile: rdfs'
    # metadata_profile: rdfs
  markdown:
    mergeimports: true
  java:
    mergeimports: true
    metadata: true
  jsonld:
    mergeimports: true
  jsonschema:
    mergeimports: true
  jsonldcontext:
    mergeimports: true
  prefixmap:
    mergeimports: true
  proto:
    mergeimports: true
  shacl:
    mergeimports: true
  shex:
    mergeimports: true
  sqlddl:
    mergeimports: true
  typescript:
    mergeimports: true
    metadata: true

...
